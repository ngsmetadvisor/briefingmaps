<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWCC Dual Map Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0d1117;
    --surface:  #161b22;
    --border:   #30363d;
    --accent:   #4a7fc1;
    --accent2:  #e8a020;
    --text:     #e6edf3;
    --muted:    #8b949e;
    --header-h: 42px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Courier New", monospace;
    overflow: hidden;
  }

  /* ── Header ── */
  #header {
    height: var(--header-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    z-index: 100;
    position: relative;
  }
  #header .logo {
    font-size: 13px;
    font-weight: bold;
    color: var(--accent);
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #header .divider {
    width: 1px;
    height: 22px;
    background: var(--border);
  }
  #header .map-labels {
    display: flex;
    gap: 24px;
    flex: 1;
  }
  .map-label {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .map-label .dot {
    width: 8px; height: 8px; border-radius: 50%;
  }
  .dot-left  { background: var(--accent); }
  .dot-right { background: var(--accent2); }

  /* ── Map panes ── */
  #maps {
    display: flex;
    height: calc(100vh - var(--header-h));
    width: 100%;
    position: relative;
  }

  .map-pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #1a1f26;
  }

  .map-pane + .map-pane {
    border-left: 2px solid var(--border);
  }

  .map-pane iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* Pane title badge */
  .pane-badge {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 500;
    background: rgba(13,17,23,0.82);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 10px;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 0.5px;
    color: var(--muted);
    pointer-events: none;
    white-space: nowrap;
    backdrop-filter: blur(4px);
  }
  .pane-badge.left  { color: var(--accent);  border-color: var(--accent); }
  .pane-badge.right { color: var(--accent2); border-color: var(--accent2); }

  /* Loading overlay */
  .pane-loading {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 400;
    transition: opacity 0.4s;
  }
  .pane-loading.hidden { opacity: 0; pointer-events: none; }
  .spinner {
    width: 28px; height: 28px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .pane-loading.right .spinner { border-top-color: var(--accent2); }
  .pane-loading span { font-size: 11px; color: var(--muted); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Sync indicator */
  #sync-indicator {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .sync-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #2ea043;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="logo">AWCC DUAL MAP</div>
  <div class="divider"></div>
  <div class="map-labels">
    <div class="map-label">
      <span class="dot dot-left"></span>
      <span>Upper Air — 850 / 500 hPa Heights &amp; Isotherms</span>
    </div>
    <div class="map-label">
      <span class="dot dot-right"></span>
      <span>Surface — MSLP &amp; 12h Precipitation</span>
    </div>
  </div>
  <div id="sync-indicator">
    <div class="sync-dot"></div>
    <span>SYNCED</span>
  </div>
</div>

<!-- Map panes -->
<div id="maps">
  <div class="map-pane" id="pane-left">
    <div class="pane-badge left">UA — 850 / 500 hPa</div>
    <div class="pane-loading" id="load-left">
      <div class="spinner"></div>
      <span>Loading upper air map…</span>
    </div>
    <iframe id="frame-left"
      src="https://ngsmetadvisor.github.io/briefingmaps/synoptic_map.html"
      onload="frameLoaded('left')">
    </iframe>
  </div>

  <div class="map-pane" id="pane-right">
    <div class="pane-badge right">SFC — MSLP &amp; QPF 12h</div>
    <div class="pane-loading right" id="load-right">
      <div class="spinner"></div>
      <span>Loading surface map…</span>
    </div>
    <iframe id="frame-right"
      src="https://ngsmetadvisor.github.io/briefingmaps/gem_surface_map.html"
      onload="frameLoaded('right')">
    </iframe>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
var _leftReady  = false;
var _rightReady = false;
var _syncing    = false;   // re-entrancy guard: prevents echo loops

// ── Frame load ─────────────────────────────────────────────────────────────
function frameLoaded(side) {
  var loadEl = document.getElementById('load-' + side);
  if (loadEl) loadEl.classList.add('hidden');

  if (side === 'left')  _leftReady  = true;
  if (side === 'right') _rightReady = true;

  if (_leftReady && _rightReady) {
    setTimeout(patchFrames, 400);
  }
}

// ── Patch both frames to emit postMessage on slider change ─────────────────
//
// Each child page calls its own slider function (synSliderChange / gemSliderChange).
// We wrap those functions so every call also fires a postMessage to the parent
// with the step index. The parent then mirrors the step to the other frame.
//
function patchFrames() {
  patchFrame('left',  'frame-left',  'synSliderChange', 'syn-time-slider', 'SYN_STEP');
  patchFrame('right', 'frame-right', 'gemSliderChange', 'gem-time-slider', 'GEM_STEP');
}

function patchFrame(side, frameId, fnName, sliderId, msgType) {
  try {
    var win = document.getElementById(frameId).contentWindow;
    if (!win) return;

    // Only patch if the function exists in that frame
    if (typeof win[fnName] !== 'function') {
      console.warn('[AWCC] ' + fnName + ' not found in ' + side + ' frame — will retry');
      setTimeout(function() { patchFrame(side, frameId, fnName, sliderId, msgType); }, 800);
      return;
    }

    var original = win[fnName];
    win[fnName] = function(idx) {
      original.call(win, idx);
      // Don't echo a step that was pushed from the parent (prevents loop)
      if (!win.__awcc_syncing) {
        window.postMessage({ type: msgType, idx: idx }, '*');
      }
    };

    console.log('[AWCC] Patched ' + fnName + ' in ' + side + ' frame');
  } catch(e) {
    console.warn('[AWCC] Could not patch ' + side + ' frame:', e);
  }
}

// ── Listen for step messages from either frame ─────────────────────────────
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data.idx === 'undefined') return;

  var type = e.data.type;
  var idx  = parseInt(e.data.idx);

  if (type === 'SYN_STEP') {
    // Left frame moved — push to right
    mirrorStep('frame-right', 'gemSliderChange', 'gem-time-slider',
               idx, '_GEM_STEPS', '_SYN_TIME_STEPS', 'frame-left');
  } else if (type === 'GEM_STEP') {
    // Right frame moved — push to left
    mirrorStep('frame-left', 'synSliderChange', 'syn-time-slider',
               idx, '_SYN_TIME_STEPS', '_GEM_STEPS', 'frame-right');
  }
});

// ── Push a step index to the target frame ─────────────────────────────────
// srcStepsVar  = variable name for the steps array in the SOURCE frame
//   (used to resolve a matching key in the target when step counts differ)
// tgtStepsVar  = variable name for the steps array in the TARGET frame
//
function mirrorStep(tgtFrameId, tgtFnName, tgtSliderId, srcIdx,
                    tgtStepsVar, srcStepsVar, srcFrameId) {
  try {
    var tgtWin = document.getElementById(tgtFrameId).contentWindow;
    if (!tgtWin) return;
    if (typeof tgtWin[tgtFnName] !== 'function') return;

    // Resolve target index — try key matching first, fall back to clamped index
    var targetIdx = srcIdx;
    try {
      var srcWin   = document.getElementById(srcFrameId).contentWindow;
      var srcSteps = srcWin[srcStepsVar];
      var tgtSteps = tgtWin[tgtStepsVar];
      if (srcSteps && tgtSteps && srcSteps[srcIdx]) {
        var srcKey = srcSteps[srcIdx].key;
        for (var i = 0; i < tgtSteps.length; i++) {
          if (tgtSteps[i].key === srcKey) { targetIdx = i; break; }
        }
        // If no key match, clamp to target's length
        if (targetIdx === srcIdx) {
          targetIdx = Math.min(srcIdx, tgtSteps.length - 1);
        }
      }
    } catch(e) { /* key-match failed, use srcIdx as-is */ }

    // Mark target frame so its own patched function doesn't echo back
    tgtWin.__awcc_syncing = true;

    // Update target slider UI
    var slider = tgtWin.document.getElementById(tgtSliderId);
    if (slider) slider.value = String(targetIdx);

    // Call target's step function
    tgtWin[tgtFnName](targetIdx);

    tgtWin.__awcc_syncing = false;
  } catch(e) {
    console.warn('[AWCC] mirrorStep error:', e);
  }
}
</script>
</body>
</html>
