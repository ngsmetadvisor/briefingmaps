name: Generate GEM Surface Map

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  trigger-downstream:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger UAanalysis
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/UAanalysis/dispatches \
            -d '{"event_type":"run-analysis"}'
      - name: Trigger SfcMap
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/SfcMap/dispatches \
            -d '{"event_type":"run-sfcmap"}'

  build:
    needs: trigger-downstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libeccodes-dev
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run map generator
        run: python forecast_gem_sfc_map.py
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          keep_files: true
