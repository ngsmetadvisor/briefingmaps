name: Generate Forecast Maps
on:
  schedule:
    - cron: '11 10 * * *'
    - cron: '43 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -q libeccodes-dev

      - name: Install Python dependencies
        run: |
          pip install \
            requests scipy matplotlib numpy pykrige \
            folium shapely branca pandas cfgrib \
            eccodes xarray metpy

      - name: Run forecast script
        timeout-minutes: 25          # converts a hang into a real failure
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25        # per-attempt timeout (mirrors step timeout)
          max_attempts: 3
          retry_wait_seconds: 60    # wait 2 min between attempts
          command: python forecast_gem_github.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          keep_files: true

  trigger-downstream:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Trigger UAanalysis
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/UAanalysis/dispatches \
            -d '{"event_type":"run-analysis"}'

      - name: Trigger SfcMap
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/SfcMap/dispatches \
            -d '{"event_type":"run-sfcmap"}'
