name: Generate GEM Surface Map

on:
  schedule:
    - cron: "37 12 * * *"   # 12:37 UTC daily  → 12Z data
    - cron: "37 18 * * *"   # 18:37 UTC daily  → 18Z data

    
  workflow_dispatch:

jobs:
  trigger-downstream:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger UAanalysis and wait for completion
        run: |
          DISPATCH_TIME=$(date -u +%s)

          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/UAanalysis/dispatches \
            -d '{"event_type":"run-analysis"}'

          echo "Dispatched run-analysis, waiting for it to appear and complete..."

          RUN_ID=""
          for i in $(seq 1 20); do
            sleep 10
            RUN_ID=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/ngsmetadvisor/UAanalysis/actions/runs?event=repository_dispatch&per_page=10" \
              | jq -r --argjson t "$DISPATCH_TIME" \
                '[.workflow_runs[] | select((.created_at | fromdateiso8601) >= ($t - 30)) | select(.name != "LLJ Soundings (radiosonde wind/CAPE)")] | sort_by(.created_at) | .[0].id // empty')
            if [ -n "$RUN_ID" ]; then
              echo "Found run ID: $RUN_ID"
              break
            fi
            echo "Run not found yet, retrying ($i/20)..."
          done

          if [ -z "$RUN_ID" ]; then
            echo "::warning::Could not find the triggered run, proceeding anyway after fallback wait"
            sleep 300
          else
            for i in $(seq 1 60); do
              STATUS=$(curl -s \
                -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/ngsmetadvisor/UAanalysis/actions/runs/$RUN_ID" \
                | jq -r '.status')
              echo "Run $RUN_ID status: $STATUS ($i/60)"
              if [ "$STATUS" = "completed" ]; then
                break
              fi
              sleep 15
            done
          fi

      - name: Trigger LLJ_OBS
        run: |
          curl -f -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/UAanalysis/dispatches \
            -d '{"event_type":"run-llj-obs"}'
      - name: Trigger SfcMap
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ngsmetadvisor/SfcMap/dispatches \
            -d '{"event_type":"run-sfcmap"}'

  build:
    needs: trigger-downstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get install -y libeccodes-dev
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Run map generator
        run: python forecast_gem_sfc_map.py
        timeout-minutes: 40
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: outputs
          keep_files: true
